name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target Strata_VST3 Strata_Standalone

      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: Strata-Windows
          path: |
            build/Strata_artefacts/Release/VST3/Strata.vst3
            build/Strata_artefacts/Release/Standalone/Strata.exe
